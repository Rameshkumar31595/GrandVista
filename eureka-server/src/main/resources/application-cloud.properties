# ===================================================================
# EUREKA SERVER - "cloud" profile (Render). Loaded ONLY when SPRING_PROFILES_ACTIVE=cloud.
# ===================================================================
server.port=${PORT:10000}
eureka.instance.hostname=${PUBLIC_HOSTNAME:${RENDER_EXTERNAL_HOSTNAME:localhost}}
# Not used (the server neither registers nor fetches), kept local so it never points at a public URL without credentials.
eureka.client.service-url.defaultZone=http://localhost:${server.port}/eureka/

# The registry is reachable from the internet: require HTTP Basic credentials for /eureka/** and the dashboard.
grandvista.eureka.auth.username=${EUREKA_USERNAME:eureka}
grandvista.eureka.auth.password=${EUREKA_PASSWORD:}
grandvista.eureka.auth.required=true

# Free instances sleep after 15 idle minutes; a sleeping service stops renewing and is evicted after the normal
# 90 s lease, and re-registers when it wakes. Self-preservation stays off (as locally) so stale entries do not linger.
server.tomcat.threads.max=30
