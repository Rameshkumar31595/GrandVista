# ===================================================================
# EUREKA SERVER - service registry and dashboard (http://localhost:9000)
# ===================================================================
spring.application.name=eureka-server
server.port=${EUREKA_PORT:9000}

eureka.instance.hostname=localhost

# The registry is a standalone server: it does not register with itself
# and does not fetch the registry from a peer.
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.client.service-url.defaultZone=http://${eureka.instance.hostname}:${server.port}/eureka/

# Self-preservation is useful in production but confusing in a local demo
# where services are frequently stopped/started, so it is disabled here.
eureka.server.enable-self-preservation=false
eureka.server.eviction-interval-timer-in-ms=10000

management.endpoints.web.exposure.include=health,info
