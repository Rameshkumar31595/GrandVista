# ===================================================================
# PAYMENT SERVICE - simulated payments and refunds (port 8084)
# ===================================================================
spring.application.name=payment-service
server.port=${PAYMENT_SERVICE_PORT:8084}
server.error.include-stacktrace=never
server.error.include-message=never

# Local secrets file in the SOA-Project root (git-ignored). Environment variables override it.
spring.config.import=optional:file:../grandvista-local.properties

# ------------------------------------------------------------------- PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/grandvista_payment_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# DEVELOPMENT CONVENIENCE ONLY - production would use Flyway/Liquibase migrations.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ------------------------------------------------------------------- security
grandvista.jwt.secret=${JWT_SECRET}
grandvista.jwt.issuer=grandvista-auth-service
grandvista.internal.api-key=${INTERNAL_API_KEY}

# ------------------------------------------------------------------- simulated gateway
# The simulated gateway declines any single payment above this amount (INR).
grandvista.payment.max-amount=${PAYMENT_MAX_AMOUNT:500000}

# ------------------------------------------------------------------- Eureka client
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:9000/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

management.endpoints.web.exposure.include=health,info
springdoc.swagger-ui.path=/swagger-ui.html
