# ===================================================================
# ROOM SERVICE - hotels, rooms, date-aware inventory, dynamic pricing (port 8082)
# ===================================================================
spring.application.name=room-service
server.port=${ROOM_SERVICE_PORT:8082}
server.error.include-stacktrace=never
server.error.include-message=never

# Local secrets file in the SOA-Project root (git-ignored). Environment variables override it.
spring.config.import=optional:file:../grandvista-local.properties

# ------------------------------------------------------------------- PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/grandvista_room_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# DEVELOPMENT CONVENIENCE ONLY - production would use Flyway/Liquibase migrations.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ------------------------------------------------------------------- security
grandvista.jwt.secret=${JWT_SECRET}
grandvista.jwt.issuer=grandvista-auth-service
grandvista.internal.api-key=${INTERNAL_API_KEY}

# ------------------------------------------------------------------- inventory
# How long a PENDING reservation hold blocks the room while payment is completed.
grandvista.inventory.hold-minutes=${HOLD_MINUTES:15}
grandvista.inventory.max-stay-nights=30
grandvista.inventory.seed-demo-data=${SEED_DEMO_DATA:true}

# ------------------------------------------------------------------- Eureka client
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:9000/eureka/}
eureka.instance.prefer-ip-address=true
# Unique per port so two Room Service instances can be registered for the load-balancing demo.
eureka.instance.instance-id=${spring.application.name}:${server.port}

management.endpoints.web.exposure.include=health,info
springdoc.swagger-ui.path=/swagger-ui.html
