# ===================================================================
# ROOM SERVICE - "cloud" profile (Render). Loaded ONLY when SPRING_PROFILES_ACTIVE=cloud;
# STS, "mvn spring-boot:run" and every docker-compose*.yml file never activate it.
# ===================================================================
# Render tells the container which port to listen on.
server.port=${PORT:10000}

# ------------------------------------------------------------------- PostgreSQL (one database per service)
# DB_HOST/DB_PORT come from the Render Postgres instance. A dedicated login (ROOM_DB_USERNAME) that can reach only
# grandvista_room_db is used when configured; otherwise the instance owner login (DB_USERNAME) is used.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${ROOM_DB_NAME:grandvista_room_db}?sslmode=${DB_SSLMODE:prefer}
spring.datasource.username=${ROOM_DB_USERNAME:${DB_USERNAME}}
spring.datasource.password=${ROOM_DB_PASSWORD:${DB_PASSWORD}}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:3}
spring.datasource.hikari.minimum-idle=1

# ------------------------------------------------------------------- load-balancing demo
# Two Render services share port 10000, so the X-Instance-Id header shows the public host name instead.
grandvista.instance-label=${spring.application.name}:${eureka.instance.hostname}

# ------------------------------------------------------------------- Eureka over the public internet
# Free Render web services cannot receive private-network traffic, so every service registers its public HTTPS name.
# EUREKA_URL (with credentials) is assembled by docker/cloud/render-entrypoint.sh.
eureka.client.service-url.defaultZone=${EUREKA_URL}
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=${PUBLIC_HOSTNAME:${RENDER_EXTERNAL_HOSTNAME}}
# Unique per container: during a zero-downtime redeploy the old and new instance share the host name, and the old one's
# shutdown (status DOWN + de-registration) must not hit the new one.
eureka.instance.instance-id=${spring.application.name}:${eureka.instance.hostname}:${RENDER_INSTANCE_ID:${HOSTNAME:${random.value}}}
eureka.instance.secure-port-enabled=${PUBLIC_TLS:true}
eureka.instance.non-secure-port-enabled=${PUBLIC_PLAIN_HTTP:false}
eureka.instance.secure-port=${PUBLIC_PORT:443}
eureka.instance.non-secure-port=${PUBLIC_PORT:443}
eureka.instance.home-page-url=${PUBLIC_SCHEME:https}://${eureka.instance.hostname}:${PUBLIC_PORT:443}/
eureka.instance.status-page-url=${PUBLIC_SCHEME:https}://${eureka.instance.hostname}:${PUBLIC_PORT:443}/actuator/info
eureka.instance.health-check-url=${PUBLIC_SCHEME:https}://${eureka.instance.hostname}:${PUBLIC_PORT:443}/actuator/health

# ------------------------------------------------------------------- small container (512 MB, 0.1 CPU)
server.tomcat.threads.max=30
# The API documentation is not routed by the gateway; keep it off on the public service URL unless asked for.
springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:false}
