# ===================================================================
# BOOKING SERVICE - booking lifecycle, Booking -> Payment -> Room workflow (port 8083)
# ===================================================================
spring.application.name=booking-service
server.port=${BOOKING_SERVICE_PORT:8083}
server.error.include-stacktrace=never
server.error.include-message=never

# Local secrets file in the SOA-Project root (git-ignored). Environment variables override it.
spring.config.import=optional:file:../grandvista-local.properties

# ------------------------------------------------------------------- PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/grandvista_booking_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# DEVELOPMENT CONVENIENCE ONLY - production would use Flyway/Liquibase migrations.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ------------------------------------------------------------------- security
grandvista.jwt.secret=${JWT_SECRET}
grandvista.jwt.issuer=grandvista-auth-service
grandvista.internal.api-key=${INTERNAL_API_KEY}

# ------------------------------------------------------------------- booking rules
grandvista.booking.max-stay-nights=30

# ------------------------------------------------------------------- downstream services
# Logical Eureka service names - resolved to real host:port by Spring Cloud LoadBalancer.
grandvista.clients.room-service-url=http://ROOM-SERVICE
grandvista.clients.payment-service-url=http://PAYMENT-SERVICE
grandvista.clients.connect-timeout=3s
grandvista.clients.read-timeout=10s

# ------------------------------------------------------------------- Eureka client
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:9000/eureka/}
# Refresh the local copy of the registry quickly so newly started instances are used sooner in demos.
eureka.client.registry-fetch-interval-seconds=5
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

management.endpoints.web.exposure.include=health,info
springdoc.swagger-ui.path=/swagger-ui.html
