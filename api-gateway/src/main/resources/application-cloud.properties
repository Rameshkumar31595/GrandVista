# ===================================================================
# API GATEWAY - "cloud" profile (Render). Loaded ONLY when SPRING_PROFILES_ACTIVE=cloud;
# STS, "mvn spring-boot:run" and every docker-compose*.yml file never activate it.
# ===================================================================
server.port=${PORT:10000}

# Backend services are other public HTTPS services; the first request after a wake-up can be slow.
spring.cloud.gateway.server.webflux.httpclient.connect-timeout=10000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=60s

# CORS_ALLOWED_ORIGINS = the static frontend's https://...onrender.com URL (set by render.yaml).

# Tell the services which visitor a request comes from (ClientAddressFilter, used by the demo-login rate limit).
# The gateway's direct peer is the hosting platform's edge proxy on a private address.
grandvista.client-address.trusted-proxies=${GATEWAY_TRUSTED_PROXIES:10\\..*|172\\.(1[6-9]|2[0-9]|3[01])\\..*|192\\.168\\..*|127\\..*}

# ------------------------------------------------------------------- free-tier keep-warm (see KeepWarmService)
# Comma separated public health URLs of eureka/auth/room/booking/payment, assembled by render-entrypoint.sh.
grandvista.keep-warm.urls=${KEEP_WARM_URLS:}
grandvista.keep-warm.interval=${KEEP_WARM_INTERVAL:10m}
grandvista.keep-warm.active-window=${KEEP_WARM_ACTIVE_WINDOW:20m}

# ------------------------------------------------------------------- Eureka over the public internet
eureka.client.service-url.defaultZone=${EUREKA_URL}
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=${PUBLIC_HOSTNAME:${RENDER_EXTERNAL_HOSTNAME}}
# Unique per container: during a zero-downtime redeploy the old and new instance share the host name, and the old one's
# shutdown (status DOWN + de-registration) must not hit the new one.
eureka.instance.instance-id=${spring.application.name}:${eureka.instance.hostname}:${RENDER_INSTANCE_ID:${HOSTNAME:${random.value}}}
eureka.instance.secure-port-enabled=${PUBLIC_TLS:true}
eureka.instance.non-secure-port-enabled=${PUBLIC_PLAIN_HTTP:false}
eureka.instance.secure-port=${PUBLIC_PORT:443}
eureka.instance.non-secure-port=${PUBLIC_PORT:443}
eureka.instance.home-page-url=${PUBLIC_SCHEME:https}://${eureka.instance.hostname}:${PUBLIC_PORT:443}/
eureka.instance.status-page-url=${PUBLIC_SCHEME:https}://${eureka.instance.hostname}:${PUBLIC_PORT:443}/actuator/info
eureka.instance.health-check-url=${PUBLIC_SCHEME:https}://${eureka.instance.hostname}:${PUBLIC_PORT:443}/actuator/health

# Re-read the Eureka registry copy often: free instances sleep, wake and re-register.
spring.cloud.loadbalancer.cache.ttl=10s
