# ===================================================================
# API GATEWAY - single entry point for clients (http://localhost:8080)
# ===================================================================
spring.application.name=api-gateway
server.port=${GATEWAY_PORT:8080}

# Local secrets file in the SOA-Project root (git-ignored). Environment variables override it.
spring.config.import=optional:file:../grandvista-local.properties

# Only the explicit routes below are exposed. Automatic "one route per Eureka service"
# is disabled so internal services/endpoints are never published by accident.
spring.cloud.gateway.server.webflux.discovery.locator.enabled=false
spring.cloud.gateway.server.webflux.httpclient.connect-timeout=3000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=15s

# Clients must never be able to impersonate a trusted internal caller.
spring.cloud.gateway.server.webflux.default-filters[0]=RemoveRequestHeader=X-Internal-Api-Key

# ------------------------------------------------------------------- AUTH-SERVICE
# The auth-service route is defined in Java (config/AuthRouteConfig.java), not here: the
# GV-002 retry settings (pre-dispatch-only retry + backoff) cannot be expressed in the
# flat filter-args map that properties bind to. Tune it via grandvista.auth-retry.*.

# ------------------------------------------------------------------- ROOM-SERVICE
spring.cloud.gateway.server.webflux.routes[0].id=room-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://ROOM-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/rooms/**,/api/hotels/**,/api/pricing-rules/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=1
# Safe to retry: only idempotent GETs, only on connection errors / 502-504,
# so a stopped Room Service instance is transparently skipped.
spring.cloud.gateway.server.webflux.routes[0].filters[1].name=Retry
spring.cloud.gateway.server.webflux.routes[0].filters[1].args.retries=2
spring.cloud.gateway.server.webflux.routes[0].filters[1].args.methods=GET
spring.cloud.gateway.server.webflux.routes[0].filters[1].args.statuses=BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
spring.cloud.gateway.server.webflux.routes[0].filters[1].args.exceptions=java.io.IOException,java.util.concurrent.TimeoutException

# ------------------------------------------------------------------- BOOKING-SERVICE
spring.cloud.gateway.server.webflux.routes[1].id=booking-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://BOOKING-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/bookings/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=StripPrefix=1

# ------------------------------------------------------------------- PAYMENT-SERVICE
spring.cloud.gateway.server.webflux.routes[2].id=payment-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://PAYMENT-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/payments/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=StripPrefix=1

# ------------------------------------------------------------------- security / CORS
grandvista.jwt.secret=${JWT_SECRET}
grandvista.jwt.issuer=grandvista-auth-service
# Comma separated list - only the React development server by default.
grandvista.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ------------------------------------------------------------------- Eureka client
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:9000/eureka/}
eureka.client.registry-fetch-interval-seconds=5
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

management.endpoints.web.exposure.include=health,info
