# ===================================================================
# AUTH SERVICE - registration, login, JWT issuing (port 8081)
# ===================================================================
spring.application.name=auth-service
server.port=${AUTH_SERVICE_PORT:8081}
server.error.include-stacktrace=never
server.error.include-message=never

# Local secrets file in the SOA-Project root (git-ignored). Environment variables override it.
spring.config.import=optional:file:../grandvista-local.properties

# ------------------------------------------------------------------- PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/grandvista_auth_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# DEVELOPMENT CONVENIENCE: Hibernate creates/updates tables automatically.
# A production system would use versioned migrations (Flyway/Liquibase) instead.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ------------------------------------------------------------------- JWT
# Base64 encoded HMAC-SHA256 key (>= 32 bytes). No default on purpose - must be configured.
grandvista.jwt.secret=${JWT_SECRET}
grandvista.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
grandvista.jwt.issuer=grandvista-auth-service

# ------------------------------------------------------------------- demo administrator
grandvista.admin.name=${ADMIN_NAME:GrandVista Administrator}
grandvista.admin.email=${ADMIN_EMAIL:admin@grandvista.com}
# No default: if ADMIN_PASSWORD is not configured, no administrator is created.
grandvista.admin.password=${ADMIN_PASSWORD:}

# ------------------------------------------------------------------- review demo login
# OFF unless explicitly enabled. Only for local / academic demonstrations - never in production.
grandvista.demo.enabled=${DEMO_MODE_ENABLED:false}
grandvista.demo.guest-one-name=${DEMO_GUEST1_NAME:Ramesh}
grandvista.demo.guest-two-name=${DEMO_GUEST2_NAME:Demo Guest 2}
grandvista.demo.manager-name=${DEMO_MANAGER_NAME:GrandVista Manager}

# ------------------------------------------------------------------- Eureka client
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:9000/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

management.endpoints.web.exposure.include=health,info
springdoc.swagger-ui.path=/swagger-ui.html
logging.level.com.grandvista=INFO
